# Runs Supabase directly on the runner. On a VM runner the runner IS the Docker
# host, so none of the devcontainer workarounds are needed.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Must be a VM runner. A `container:` job breaks Supabase's bind mounts.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Preflight
        run: ./scripts/preflight.sh

      - name: Start Supabase
        run: npx supabase start

      - name: Smoke test
        run: npm run smoke

      - name: Stop Supabase
        if: always()
        run: npx supabase stop
