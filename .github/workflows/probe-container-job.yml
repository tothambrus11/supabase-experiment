# Evidence for a claim in the README: a `container:` job CANNOT host the DooD
# devcontainer, because GitHub mounts the workspace at /__w/<repo>/<repo> inside
# the job container while the daemon (the runner's) only knows
# /home/runner/work/<repo>/<repo>.
#
# Dispatch it from the Actions tab to reproduce. Recorded result: the socket IS
# mounted and the daemon IS reachable (28.0.4), but preflight check 3 fails with
# "the daemon does NOT see this workspace" - silently, via an empty dir, not an
# error - and the script exits 1.
name: Probe container job

on:
  workflow_dispatch:

jobs:
  container-job:
    runs-on: ubuntu-latest
    container: node:24        # <-- the thing under test

    steps:
      - uses: actions/checkout@v4

      - name: Where does this job think it lives?
        run: |
          echo "PWD               = $PWD"
          echo "GITHUB_WORKSPACE  = $GITHUB_WORKSPACE"
          echo "--- is this a container? ---"
          ls -la /.dockerenv 2>/dev/null || echo "no /.dockerenv"
          head -2 /proc/1/cgroup 2>/dev/null || true

      - name: Is the runner's Docker daemon reachable from in here?
        run: |
          ls -l /var/run/docker.sock 2>/dev/null || echo "NO docker.sock mounted"
          command -v docker >/dev/null && echo "docker cli present" || echo "no docker cli"

      - name: Install docker CLI, then run the preflight
        continue-on-error: true
        run: |
          apt-get update -qq && apt-get install -y -qq docker.io >/dev/null 2>&1 || true
          command -v docker >/dev/null || { echo "could not install docker cli"; exit 0; }
          docker info >/dev/null 2>&1 && echo "=== daemon reachable ===" || echo "=== daemon NOT reachable ==="
          ./scripts/preflight.sh --require dood || echo "preflight exit=$? (non-zero expected here)"
